services:
  seaweedfs:
    image: chrislusf/seaweedfs
    command: mini -dir=/data
    ports:
      - "8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret
      S3_BUCKET: synthetic-vibration-sensor-events
    volumes:
      - seaweed_data:/data
    restart: unless-stopped

volumes:
  seaweed_data:
